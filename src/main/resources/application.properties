
# ==========================================
# Project: SFIP
# File: application.properties
# ==========================================

# Application Configuration
spring.application.name=SFIP
server.port=8080


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sfip_db?serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=9000000


# Gemini AI Configuration
app.ai.gemini.api-key=${GEMINI_API_KEY}
app.ai.gemini.model=${GEMINI_MODEL}


# Groq AI Configuration
groq.api.key=${GROQ_API_KEY}
groq.api.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.api.url=https://api.groq.com/openai/v1


# Python ML Service Configuration
app.ml.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}

# ==========================================
# ML Diagnostic Logging
# ==========================================

logging.level.com.sfip.backend.integration.ml=DEBUG